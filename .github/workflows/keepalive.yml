name: session-keepalive

# On-demand session liveness check. DISPROVEN THEORY (2026-08-17): the session
# does NOT have an idle timeout — it has an absolute ~12h TTL. A keep-alive
# page load every 30 min did not extend it one minute (minted 2026-08-16
# 23:46Z, died between 11:15Z and 11:45Z next day, matching the 11.8h max
# healthy streak in 5 weeks of CSV history). The 30-min schedule is therefore
# removed; only a real login (password entry) renews the session.
on:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: keepalive
  cancel-in-progress: false

jobs:
  keepalive:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Playwright Chromium
        run: |
          pip install playwright
          playwright install --with-deps chromium

      # Fails (and emails) if the session is dead — that means a true logout,
      # which needs a local re-bootstrap: ./.venv/bin/python refresh_cookie.py --login
      - name: Load the GPU page to slide the session's idle timeout
        env:
          DO_STATE: ${{ secrets.DO_STATE }}
        run: python cookie_probe.py
