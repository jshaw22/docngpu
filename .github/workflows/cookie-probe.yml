name: cookie-probe

# On-demand viability test for running the cookie refresher on GitHub Actions:
# can headless Chromium on a runner hold a working DO session, or does
# Cloudflare challenge datacenter IPs on page loads? See cookie_probe.py.
on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Playwright Chromium
        run: |
          pip install playwright
          playwright install --with-deps chromium

      - name: Probe DO session from a runner IP
        env:
          DO_STATE: ${{ secrets.DO_STATE }}
        run: python cookie_probe.py
