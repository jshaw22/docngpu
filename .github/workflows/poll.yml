name: poll-gpu-availability

# Half-hourly poll of DO GPU availability, committing results to availability.csv.
on:
  schedule:
    # At :07 and :37 (GitHub cron runs in UTC and is best-effort — it can be
    # delayed several minutes under load, which is fine for sampling).
    - cron: "7,37 * * * *"
  workflow_dispatch: {}   # lets you run it on demand from the Actions tab

# Allow the job to push the updated CSV back to the repo.
permissions:
  contents: write

concurrency:
  group: poll
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    # Job-level so step `if:` conditions can check the secret is configured.
    env:
      GH_PAT: ${{ secrets.GH_PAT }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # continue-on-error so a failed poll (expired cookie) still reaches the
      # commit step — gpu_monitor.py writes a NO_DATA row before exiting
      # non-zero, and we want that row committed. A final step re-fails the
      # run so the failure is still visible / notifies by email.
      - name: Poll DO GPU availability
        id: poll
        continue-on-error: true
        env:
          DO_COOKIE: ${{ secrets.DO_COOKIE }}
        run: python gpu_monitor.py

      # Self-heal: a failed poll almost always means the server-side session
      # died. Re-mint it the way a real browser would (remember-me re-auth in
      # headless Chromium), persist the fresh cookies to the repo secrets, and
      # re-poll in the same run — no human needed. See cookie_heal.py.
      # Requires GH_PAT (fine-grained, Actions-secrets write); without it the
      # heal is skipped, because a re-auth can rotate the remember-me token
      # and an unpersisted rotation would strand the pipeline.
      - name: Heal session (headless remember-me re-auth)
        id: heal
        if: steps.poll.outcome == 'failure' && env.GH_PAT != ''
        continue-on-error: true
        env:
          DO_STATE: ${{ secrets.DO_STATE }}
          DO_EMAIL: ${{ secrets.DO_EMAIL }}
          DO_PASSWORD: ${{ secrets.DO_PASSWORD }}
          COOKIE_OUT: ${{ runner.temp }}/cookie.txt
        run: |
          pip install playwright
          playwright install --with-deps chromium
          python cookie_heal.py

      - name: Re-poll with the healed session
        id: repoll
        if: steps.heal.outcome == 'success'
        continue-on-error: true
        run: |
          echo "::add-mask::$(cat "${{ runner.temp }}/cookie.txt")"
          DO_COOKIE="$(cat "${{ runner.temp }}/cookie.txt")" python gpu_monitor.py

      - name: Commit new data
        run: |
          git config user.name "gpu-monitor-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add availability.csv
          if git diff --staged --quiet; then
            echo "No new data to commit."
          else
            git commit -m "data: poll $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            # Rebase-pull guards against a race with a manual push.
            git pull --rebase --autostash origin ${GITHUB_REF_NAME} || true
            git push
          fi

      # Only fail (and email) when the self-heal couldn't recover — that's the
      # rare case that genuinely needs a human (expired remember-me token:
      # run refresh_cookie.py --login locally to re-bootstrap).
      - name: Surface poll failure
        if: steps.poll.outcome == 'failure' && steps.repoll.outcome != 'success'
        run: |
          echo "::error::Poll failed and self-heal did not recover. Re-bootstrap: run refresh_cookie.py --login locally (pushes fresh DO_COOKIE + DO_STATE)."
          exit 1
